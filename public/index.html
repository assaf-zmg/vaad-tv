<!DOCTYPE html>

<head>

  <title>לוח מודעות הבניין</title>
  <!-- D51: watchdog. Runs first, before any stylesheet. If dashboard.js never
       starts or its heartbeat (window.__vaadBeat, set by updateClock) stops for
       90s, reload with a cache-buster, but only after a small XHR to our server
       succeeds: a reload while offline leaves the browser's error page, with no
       script to recover. Never-started pages back off (90s, 3, 6, 10 min max).
       Until the script beats, the clock shows the device time. ES5 only. -->
  <script id="vaad-watchdog">
  (function () {
    var CHECK_MS = 60000, STALE_MS = 90000, MAX_MS = 600000, RETRY_MS = 300000;
    var start = +new Date();
    var m = /[?&]w=(\d+)/.exec(window.location.search || '');
    var streak = m ? parseInt(m[1], 10) : 0;
    var offset = null;
    window.__vaadBeat = 0;
    window.onerror = function (msg, src, line) {
      window.__vaadLastError = new Date() + ' ' + msg + ' (' + src + ':' + line + ')';
      try { localStorage.setItem('vaadtv_last_error', window.__vaadLastError); } catch (e) {}
    };
    try { offset = JSON.parse(localStorage.getItem('vaadtv_dashboard_cache')).utcOffset; } catch (e) {}
    if (typeof offset !== 'number') offset = null;

    function pad(x) { return x < 10 ? '0' + x : '' + x; }
    function tick() {
      if (window.__vaadBeat) return;
      var el = document.getElementById('clock');
      if (!el) return;
      var now = new Date();
      var h = offset === null ? now.getHours() : ((now.getUTCHours() + offset) % 24 + 24) % 24;
      el.innerHTML = pad(h) + ':' + pad(offset === null ? now.getMinutes() : now.getUTCMinutes());
    }
    function reloadUrl(n) {
      var parts = (window.location.search || '').replace(/^\?/, '').split('&'), out = [], i;
      for (i = 0; i < parts.length; i++) if (parts[i] && !/^(r|w)=/.test(parts[i])) out.push(parts[i]);
      out.push('r=' + (+new Date()));
      if (n) out.push('w=' + n);
      return window.location.pathname + '?' + out.join('&');
    }
    function safeReload(n, onFail) {
      var done = false, x = new XMLHttpRequest();
      function fail() { if (done) return; done = true; if (onFail) onFail(); }
      x.onreadystatechange = function () {
        if (x.readyState !== 4 || done) return;
        if (x.status === 200) { done = true; window.location.replace(reloadUrl(n)); } else fail();
      };
      x.onerror = fail;
      x.ontimeout = fail;
      try { x.open('GET', '/api/ping?t=' + (+new Date()), true); x.timeout = 10000; x.send(); } catch (e) { fail(); }
    }
    function check() {
      var beat = window.__vaadBeat;
      var limit = beat ? STALE_MS : Math.min(STALE_MS * Math.pow(2, streak), MAX_MS);
      if (+new Date() - (beat || start) > limit) {
        safeReload(beat ? 1 : streak + 1, function () { setTimeout(check, RETRY_MS); });
        return;
      }
      setTimeout(check, CHECK_MS);
    }
    window.__vaadSafeReload = safeReload;
    setInterval(tick, 1000);
    setTimeout(check, CHECK_MS);
  })();
  </script>

  <!-- D51: load dashboard.js with retries (5, 15, 30, 60 s, cache-busted); after that the watchdog reloads. -->
  <script id="vaad-loader">
  (function () {
    var waits = [5, 15, 30, 60], tries = 0;
    function load() {
      var s = document.createElement('script');
      s.src = 'js/dashboard.js' + (tries ? '?v=' + (+new Date()) : '');
      s.onerror = function () {
        if (s.parentNode) s.parentNode.removeChild(s);
        if (tries < waits.length) setTimeout(load, waits[tries++] * 1000);
      };
      document.body.appendChild(s);
    }
    load();
  })();
  </script>
